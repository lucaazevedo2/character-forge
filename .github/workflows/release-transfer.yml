name: Verify and assemble Character Forge release
on:
  push:
    branches: [release/v2.1.0-20261117]
    paths: ['.release-transfer/manifest.gz.000']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify beta files and assemble release tree
        shell: python
        run: |
          import base64
          import concurrent.futures
          import gzip
          import hashlib
          import json
          import pathlib
          import subprocess
          import tarfile
          import time
          import urllib.parse
          import urllib.request

          transfer = pathlib.Path('.release-transfer')

          def read_parts(prefix):
              return base64.b64decode(b''.join(p.read_bytes() for p in sorted(transfer.glob(prefix + '.*'))), validate=True)

          manifest = json.loads(gzip.decompress(read_parts('manifest.gz')))
          supplement = read_parts('supplement.tar.gz')
          assert hashlib.sha256(supplement).hexdigest() == manifest['supplement']
          pathlib.Path('/tmp/forge-supplement.tar.gz').write_bytes(supplement)
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          base = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
          assert base == '5c938aa18bb8a8b5d5654a77b99bd2416e19b1bc', base
          subprocess.run(['git', 'switch', '--detach', base], check=True)

          def download(item):
              name, expected = item
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              url = 'https://lucas-character-forge.lucaazevedo.chatgpt.site/' + urllib.parse.quote(name)
              request = urllib.request.Request(url, headers={'User-Agent': 'CharacterForge release verification'})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request, timeout=25) as response:
                          data = response.read()
                      assert hashlib.sha256(data).hexdigest() == expected, name
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(data)
                      return
                  except Exception:
                      if attempt == 3:
                          raise
                      time.sleep(1 << attempt)

          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as pool:
              for _ in pool.map(download, manifest['remote'].items()):
                  pass
          with tarfile.open('/tmp/forge-supplement.tar.gz') as archive:
              archive.extractall(filter='data')
      - name: Verify Git tree and publish release candidate
        run: |
          git add -A
          test "$(git write-tree)" = "1654b30dd193d08efd816b7ae40f924589dee732"
          git config user.name "Character Forge release"
          git config user.email "126037774+lucaazevedo2@users.noreply.github.com"
          git commit -m "Release 2.1.0 from the verified Sites beta"
          git push origin HEAD:refs/heads/release/v2.1.0-ready
