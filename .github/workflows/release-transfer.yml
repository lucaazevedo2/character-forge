name: Assemble verified Character Forge 2.2.0
on:
  push:
    branches: [release/v2.1.0-20261117]
    paths: ['.github/workflows/release-transfer.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and create release candidate
        env:
          RELEASE_PATCH: ''
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = c71f49d2254338ba3c11fb93e9200db6a9507b24
          git switch --detach origin/main
          printf '%s' "$RELEASE_PATCH" | base64 -d | gzip -d | git apply --index
          test "$(git write-tree)" = bce7b22e6e65d95abda31ab7151147e3bbb06c09
          git config user.name "Character Forge release"
          git config user.email "126037774+lucaazevedo2@users.noreply.github.com"
          git commit -m "Release 2.2.0: compendium references and DM party removal"
          git push origin HEAD:refs/heads/release/v2.2.0-ready
