button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:disabled{cursor:not-allowed}a{color:inherit}input,select,textarea{font-size:16px}button,input,select,textarea,a{touch-action:manipulation}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
button{transition:background .15s,border-color .15s,transform .15s}button:not(:disabled):active{transform:translateY(1px)}[hidden]{display:none!important}h1,h2,h3{line-height:1.2;font-weight:600}h1,h2,.display{font-family:var(--font-display)}h3{font-family:var(--font-body);font-size:15px}.icon{flex-shrink:0;vertical-align:middle;width:20px;height:20px}
.app{max-width:1200px;margin:0 auto;padding:0 40px 130px}.screen{display:none;min-width:0}.screen.active{display:block;animation:fade .18s ease}@keyframes fade{from{opacity:0}to{opacity:1}}
.masthead{display:flex;align-items:center;gap:40px;min-height:96px;border-bottom:1px solid var(--stone);margin-bottom:40px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}.brand h1{font-size:27px;white-space:nowrap}.brand-mark{display:grid;place-items:center;color:var(--gold)}.brand-mark .icon{width:34px;height:34px}.top-nav{display:flex;align-items:stretch;gap:26px;align-self:stretch;margin-left:auto}.top-nav button{font-size:13px;color:var(--dim);border-bottom:2px solid transparent;padding-top:2px;min-height:44px}.top-nav button[aria-current=page]{color:var(--parchment);border-color:var(--gold)}.top-nav button:hover{color:var(--parchment)}.edition{display:flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;color:var(--faded)}.edition span{border:1px solid var(--stone);padding:2px 6px;border-radius:4px;color:var(--gold)}
.library-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:8px 0 38px}.eyebrow{font-size:10px;font-weight:600;color:var(--gold);margin-bottom:7px}.library-heading h2{font-size:42px}.library-sub{color:var(--dim);font-size:13px;margin-top:9px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 18px;min-height:46px;border-radius:6px;font-size:13px;font-weight:600;text-align:center;line-height:1.4}.btn.primary{background:var(--gold);color:#241d19;border:1px solid var(--gold)}.btn.primary:not(:disabled):hover{background:#f5c7ac;border-color:#f5c7ac}.btn.primary:disabled{background:var(--panel2);border-color:var(--stone);color:var(--dim)}.btn.ghost{border:1px solid var(--stone-hi);color:var(--faded)}.btn.ghost:hover{background:var(--panel2);color:var(--parchment)}.btn.danger{color:var(--blood);border:1px solid #714849}.btn.danger:hover{background:#3c292c}

/* ════════════════ HELPERS ════════════════ */
function mod(c,a){ return Math.floor((finalScore(c,a)-10)/2); }
function fmt(n){ return (n>=0?"+":"")+n; }
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function d(n){ return 1+Math.floor(Math.random()*n); }
function byId(id){ return document.getElementById(id); }
function raceOf(c){ return RACES.find(r=>r.id===c.race); }
function classOf(c){ return CLASSES.find(k=>k.id===c.klass); }
function bgOf(c){
  if(c.background==="custom"){
    const cb=c.customBg||{};
    return {id:"custom", name:cb.name||"Custom Background", skills:cb.skills||[],
      feature:cb.feature||"As written in your source book.",
      extra:cb.extra||"Languages and tools as written in your source book."};
  }
  return BACKGROUNDS.find(b=>b.id===c.background);
}
function subsFor(classId){
  const k=CLASSES.find(x=>x.id===classId); if(!k) return [];
  return [{id:"srd",...k.subclass}, ...CUSTOM.subs.filter(s=>s.classId===classId)];
}
function subclassOf(c){
  const list=subsFor(c.klass);
  return list.find(s=>s.id===c.subId) || list[0] || {name:"—",level:3,desc:""};
}
let CUSTOM={races:[],subs:[],bgs:[]};
function applyCustom(){
  for(let i=RACES.length-1;i>=0;i--) if(RACES[i].custom) RACES.splice(i,1);
  for(let i=BACKGROUNDS.length-1;i>=0;i--) if(BACKGROUNDS[i].custom) BACKGROUNDS.splice(i,1);
  CUSTOM.races.forEach(r=>RACES.push(r));
  CUSTOM.bgs.forEach(b=>BACKGROUNDS.push(b));
}
async function saveCustom(){ await storeSet("forge-custom",CUSTOM); applyCustom(); }

function racialBonus(c,a){
  const r=raceOf(c); if(!r) return 0;
  let b=(r.bonuses[a]||0);
  if(r.id==="halfelf" && (c.halfElfBonus||[]).includes(a)) b+=1;
  return b;
}
function finalScore(c,a){ return (c.base?.[a]||10) + racialBonus(c,a); }

function autoSkills(c){
  const out=new Set();
  const r=raceOf(c);
  if(r?.id==="highelf") out.add("perception");
  if(r?.id==="halforc") out.add("intimidation");
  (c.halfElfSkills||[]).forEach(s=>out.add(s));
  return out;
}
function allProfSkills(c){
  const out=autoSkills(c);
  (c.skills||[]).forEach(s=>out.add(s));
  (bgOf(c)?.skills||[]).forEach(s=>out.add(s));
  return out;
}
function maxHP(c){
  const k=classOf(c); if(!k) return 0;
  let hp=k.hitDie+mod(c,"con");
  if(raceOf(c)?.hpPerLevel) hp+=raceOf(c).hpPerLevel;
  if(k.hpPerLevel) hp+=k.hpPerLevel;
  return Math.max(1,hp);
}

/* ════════════════ STORAGE ════════════════ */
const mem={};
async function storeGet(key){
  try{ if(window.storage){ const r=await window.storage.get(key); return r?JSON.parse(r.value):null; } }
  catch(e){ /* key missing or unavailable */ }
  try { const saved=localStorage.getItem(key); if(saved) return JSON.parse(saved); } catch(e){}
  return mem[key]?JSON.parse(mem[key]):null;
}
async function storeSet(key,val){
  const s=JSON.stringify(val); mem[key]=s;
  try { localStorage.setItem(key,s); } catch(e){}
  try{ if(window.storage) await window.storage.set(key,s); }catch(e){}
}

/* ════════════════ RENDER SHELL ════════════════ */
function render(){
  document.body.dataset.view=view;
  byId("topCharacters").setAttribute("aria-current",view==="home"?"page":"false");

  else if(view==="wizard"){ zig.style.display="flex"; cap.style.display="block"; byId("scr-step").classList.add("active"); renderZig(step); renderStep(); }
  else if(view==="custom"){ zig.style.display="none"; cap.style.display="none"; byId("scr-step").classList.add("active"); renderCustom(byId("scr-step")); }

}
function renderZig(cur){

/* ════════════════ NAV ════════════════ */
function stepValid(){
  const c=draft;
  if(step===0){ if(!c.race) return "Choose a race";
    const r=raceOf(c);
    if(r.id==="halfelf"){ if((c.halfElfBonus||[]).length!==2) return "Pick two abilities for +1"; if((c.halfElfSkills||[]).length!==2) return "Pick two bonus skills"; }
    return true; }
  if(step===1){ if(!c.klass) return "Choose a class";
    const k=classOf(c); if((c.skills||[]).length!==k.skillCount) return `Pick ${k.skillCount} skills (${(c.skills||[]).length}/${k.skillCount})`;
    return true; }
  if(step===2){
    if(c.ablMethod==="array"){ const v=Object.values(c.arrayAssign); if(v.includes(null)) return "Assign every score"; if(new Set(v).size!==6) return "Each value must be used once"; }
    if(c.ablMethod==="pb"){ if(pbSpent(c)>27) return "Over budget — remove points"; }
    if(c.ablMethod==="roll"){ if(c.rolled.length!==6) return "Roll your scores first"; const v=Object.values(c.rollAssign); if(v.includes(null)) return "Assign every rolled score"; }
    return true; }
  if(step===3){ if(!c.background) return "Choose a background";
    if(c.background==="custom"){
      if(!(c.customBg?.name||"").trim()) return "Name your custom background";
      if((c.customBg?.skills||[]).length!==2) return "Pick two skills for it";
    }
    return true; }
  if(step===4){ return (c.name||"").trim() ? true : "Every hero needs a name"; }
  return true;
}
function renderNav(){
  const bar=byId("navbar"), inner=byId("navInner");
  bar.querySelectorAll(".hint").forEach(x=>x.remove());
  if(view==="home"){ bar.classList.remove("show"); return; }
  bar.classList.add("show");
  if(view==="custom"||view==="legal"){
    inner.innerHTML=`<button class="btn ghost" id="nvHome">Back to Ledger</button>`;
    byId("nvHome").onclick=()=>{ view="home"; render(); };
    bar.querySelectorAll(".hint").forEach(x=>x.remove());
    return;
  }
  if(view==="sheet"){
    inner.innerHTML=`<button class="btn ghost" id="nvHome">${icon("ArrowLeft")} Characters</button><button class="btn danger" id="nvDel">${icon("Trash2")} Delete character</button>`;
    byId("nvHome").onclick=()=>{ view="home"; render(); };
    byId("nvDel").onclick=async()=>{
      if(confirm("Bury this character? This removes them from the ledger.")){
        chars=chars.filter(c=>c.id!==draft.id); await storeSet("forge-chars",chars); view="home"; render(); }
    };
    return;
  }
  const v=stepValid();
  inner.innerHTML=`<button class="btn ghost" id="nvBack">${icon("ArrowLeft")} ${step===0?"Characters":"Back"}</button>
    <button class="btn primary" id="nvNext" ${v===true?"":"disabled"}>${step===4?"Create character":"Continue"} ${icon("ArrowRight")}</button>`;
  byId("nvBack").onclick=()=>{ if(step===0){ view="home"; } else step--; render(); };
  byId("nvNext").onclick=async()=>{
    if(stepValid()!==true) return;
    if(step<4){ if(step===2) commitScores(); step++; render(); }
    else { await finalizeCharacter(); }
  };
  bar.querySelectorAll(".hint").forEach(x=>x.remove());
  if(v!==true){ const h=document.createElement("div"); h.className="hint warn"; h.style.textAlign="center"; h.style.marginTop="6px"; h.style.maxWidth="760px"; h.style.margin="6px auto 0"; h.textContent=v; bar.appendChild(h); }
}

/* ════════════════ STEP RENDERING ════════════════ */
function renderStep(){
  const el=byId("scr-step");
  if(step===0) renderRace(el);
  else if(step===1) renderClass(el);
  else if(step===2) renderScores(el);
  else if(step===3) renderBackground(el);
  else renderDetails(el);
}

/* ── Step 0: Race ── */
function renderRace(el){
  const c=draft;
  let html=`<div class="step-head"><h2>Choose Your Race</h2><p>Nine peoples of the Forgotten Realms — 2014 rules only, no 2024 species.</p></div><div class="grid two">`;
  html+=RACES.map(r=>{
    const bon=Object.entries(r.bonuses).map(([a,v])=>`+${v} ${ABL_NAMES[a].slice(0,3)}`).join(", ");
    return `<button class="pick ${c.race===r.id?"selected":""}" data-r="${r.id}">
      <div class="pk-tag">${bon}${r.id==="halfelf"?" +1/+1":""}${r.custom?" · ◈ custom":""}</div>
      <div class="pk-name">${r.name}</div>
      <div class="pk-desc">${r.tag}</div></button>`;
  }).join("")+`</div>`;
  const r=raceOf(c);
  if(r){
    html+=`<div class="tablet detail"><div class="pk-name" style="font-size:1.2rem">${esc(r.name)}</div>
      <p style="color:var(--faded);margin-top:4px">${esc(r.desc)}</p>
      <h3>Traits</h3>${r.traits.map(t=>`<div class="feat"><b>${esc(t[0])}.</b> <span>${esc(t[1])}</span></div>`).join("")}
      <div class="feat"><b>Speed.</b> <span>${r.speed} ft.</span></div>
      <div class="feat"><b>Languages.</b> <span>${r.langs}</span></div>`;
    if(r.id==="dragonborn"){
      html+=`<h3>Draconic Ancestry</h3><div class="chiplist">${DRAGON_TYPES.map(([nm,dm])=>
        `<button class="chip ${c.dragonType===nm?"on":""}" data-dt="${nm}">${nm} · ${dm}</button>`).join("")}</div>`;
    }
    if(r.id==="halfelf"){
      html+=`<h3>+1 to Two Abilities</h3><div class="chiplist">${ABILITIES.filter(a=>a!=="cha").map(a=>
        `<button class="chip ${(c.halfElfBonus||[]).includes(a)?"on":""}" data-hb="${a}">${ABL_NAMES[a]}</button>`).join("")}</div>
        <h3>Two Bonus Skills</h3><div class="chiplist">${SKILLS.map(s=>
        `<button class="chip ${(c.halfElfSkills||[]).includes(s.id)?"on":""}" data-hs="${s.id}">${s.name}</button>`).join("")}</div>`;
    }
    html+=`</div>`;

  el.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{ c.dragonType=b.dataset.dt; render(); });
  el.querySelectorAll("[data-hb]").forEach(b=>b.onclick=()=>{ toggle(c.halfElfBonus,b.dataset.hb,2); render(); });
  el.querySelectorAll("[data-hs]").forEach(b=>b.onclick=()=>{ toggle(c.halfElfSkills,b.dataset.hs,2); render(); });
}
function toggle(arr,v,max){ const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else if(arr.length<max) arr.push(v); }

      :`<h3>Archetype — ${esc(subclassOf(c).name)}</h3>`}

/* ── Step 2: Ability scores ── */
function pbSpent(c){ return ABILITIES.reduce((t,a)=>t+PB_COST[c.pb[a]],0); }
function currentBase(c,a){
  if(c.ablMethod==="array") return c.arrayAssign[a]??10;
  if(c.ablMethod==="pb") return c.pb[a];
  return c.rollAssign[a]??10;
}
function commitScores(){
  const c=draft; const b={};
  ABILITIES.forEach(a=>b[a]=currentBase(c,a));
  c.base=b;
}
function renderScores(el){
  const c=draft;
  const tabs=[["array","Standard Array"],["pb","Point Buy"],["roll","Roll 4d6"]];
  let html=`<div class="step-head"><h2>Ability Scores</h2><p>Racial bonuses are shown in green and added automatically.</p></div>
    <div class="method-tabs">${tabs.map(t=>`<button class="${c.ablMethod===t[0]?"on":""}" data-m="${t[0]}">${t[1]}</button>`).join("")}</div>`;

  if(c.ablMethod==="pb"){
    html+=`<div class="pb-bank">Points remaining: <b>${27-pbSpent(c)}</b> / 27</div>`;
  }
  if(c.ablMethod==="roll"){
    html+=`<div class="roll-bar"><button id="btnRoll">${c.rolled.length?"Reroll All (4d6 drop lowest)":"Roll 4d6 drop lowest × 6"}</button></div>`;
    if(c.rolled.length){
      const used=Object.values(c.rollAssign).filter(v=>v!==null);
      const pool=[...c.rolled]; const usedCopy=[...used];
      html+=`<div class="roll-pool">${pool.map(v=>{
        const i=usedCopy.indexOf(v); const isUsed=i>=0; if(isUsed) usedCopy.splice(i,1);
        return `<div class="die-chip ${isUsed?"used":""}">${v}</div>`; }).join("")}</div>`;
    }
  }

  html+=`<div class="abl-grid">`+ABILITIES.map(a=>{
    const base=currentBase(c,a), bonus=racialBonus(c,a), tot=base+bonus, m=Math.floor((tot-10)/2);
    let ctrl="";
    if(c.ablMethod==="array"){
      ctrl=`<select data-arr="${a}"><option value="">—</option>${STANDARD_ARRAY.map(v=>
        `<option value="${v}" ${c.arrayAssign[a]===v?"selected":""}>${v}</option>`).join("")}</select>`;
    } else if(c.ablMethod==="pb"){
      ctrl=`<div class="pb-ctrl"><button data-pb="${a}" data-d="-1">−</button><button data-pb="${a}" data-d="1">+</button></div>`;
    } else {
      const opts=[...new Set(c.rolled)].sort((x,y)=>y-x);
      ctrl=`<select data-roll="${a}" ${c.rolled.length?"":"disabled"}><option value="">—</option>${opts.map(v=>
        `<option value="${v}" ${c.rollAssign[a]===v?"selected":""}>${v}</option>`).join("")}</select>`;
    }
    return `<div class="abl"><div class="nm">${ABL_NAMES[a].slice(0,3).toUpperCase()}</div>
      <div class="val">${tot}</div><div class="mod">${fmt(m)}</div>
      <div class="bonus">${bonus?`+${bonus} racial`:"&nbsp;"}</div>${ctrl}</div>`;
  }).join("")+`</div>`;

  const k=classOf(c);
  if(k) html+=`<p class="hint" style="text-align:center;margin-top:12px">Tip for a ${k.name}: prioritize <b style="color:var(--gold)">${k.saves.map(a=>ABL_NAMES[a]).join(" and ")}</b>, and Constitution keeps everyone alive.</p>`;

  el.innerHTML=html;
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ c.ablMethod=b.dataset.m; render(); });
  el.querySelectorAll("[data-arr]").forEach(s=>s.onchange=()=>{
    const a=s.dataset.arr, v=s.value===""?null:+s.value;
    if(v!==null){ for(const o of ABILITIES){ if(o!==a && c.arrayAssign[o]===v) c.arrayAssign[o]=null; } }
    c.arrayAssign[a]=v; render();
  });
  el.querySelectorAll("[data-pb]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.pb, dlt=+b.dataset.d, nv=c.pb[a]+dlt;
    if(nv<8||nv>15) return;
    if(dlt>0 && pbSpent(c)-PB_COST[c.pb[a]]+PB_COST[nv]>27) return;
    c.pb[a]=nv; render();
  });
  el.querySelectorAll("[data-roll]").forEach(s=>s.onchange=()=>{
    const a=s.dataset.roll, v=s.value===""?null:+s.value;
    if(v!==null){
      const counts={}; c.rolled.forEach(x=>counts[x]=(counts[x]||0)+1);
      ABILITIES.forEach(o=>{ if(o!==a && c.rollAssign[o]!==null) counts[c.rollAssign[o]]--; });
      if(!counts[v]||counts[v]<=0){ // stealing from someone
        for(const o of ABILITIES){ if(o!==a && c.rollAssign[o]===v){ c.rollAssign[o]=null; break; } }
      }
    }
    c.rollAssign[a]=v; render();
  });
  const btn=byId("btnRoll");
  if(btn) btn.onclick=()=>{
    c.rolled=Array.from({length:6},()=>{ const r=[d(6),d(6),d(6),d(6)].sort((x,y)=>x-y); return r[1]+r[2]+r[3]; }).sort((x,y)=>y-x);
    c.rollAssign={str:null,dex:null,con:null,int:null,wis:null,cha:null};
    render();
  };
}

      <div class="field"><label>Background name</label><input id="cbName" value="${esc(cb.name)}" placeholder="e.g. Far Traveler" autocomplete="off"></div>
      <h3>Two Skills <span style="color:var(--faded);text-transform:none;letter-spacing:0">(${cb.skills.length}/2)</span></h3>
      <div class="chiplist">${SKILLS.map(s=>`<button class="chip ${cb.skills.includes(s.id)?"on":""}" data-cbs="${s.id}">${s.name}</button>`).join("")}</div>
      <div class="field" style="margin-top:12px"><label>Feature (optional)</label><textarea id="cbFeat" placeholder="What the feature does…">${esc(cb.feature)}</textarea></div>
      <div class="field"><label>Languages &amp; tools (optional)</label><input id="cbExtra" value="${esc(cb.extra)}" placeholder="e.g. One language, one gaming set" autocomplete="off"></div>
    </div>`;
  }
  const b=bgOf(c);
  if(b && c.background!=="custom"){
    const have=new Set([...autoSkills(c),...(c.skills||[])]);
    const dup=b.skills.filter(s=>have.has(s));
    html+=`<div class="tablet detail"><div class="pk-name" style="font-size:1.2rem">${b.name}</div>
      <div class="feat" style="margin-top:8px"><b>Skills.</b> <span>${b.skills.map(id=>SKILLS.find(s=>s.id===id).name).join(", ")}</span></div>
      <div class="feat"><b>Feature.</b> <span>${b.feature}</span></div>
      <div class="feat"><b>Also grants.</b> <span>${b.extra}</span></div>

    </div>`;
  }
  el.innerHTML=html;
  el.querySelectorAll("[data-b]").forEach(btn=>btn.onclick=()=>{ c.background=btn.dataset.b; render(); });
  el.querySelectorAll("[data-cbs]").forEach(btn=>btn.onclick=()=>{ toggle(c.customBg.skills,btn.dataset.cbs,2); render(); });
  const cbn=byId("cbName"), cbf=byId("cbFeat"), cbe=byId("cbExtra");
  if(cbn) cbn.oninput=e=>{ c.customBg.name=e.target.value; renderNav(); };
  if(cbf) cbf.oninput=e=>{ c.customBg.feature=e.target.value; };
  if(cbe) cbe.oninput=e=>{ c.customBg.extra=e.target.value; };
}

async function finalizeCharacter(){
  const c=draft, k=classOf(c);
  c.hp=maxHP(c); c.tempHp=0; c.deathS=0; c.deathF=0; c.slotsSpent=0;
  c.ac=k.ac(c); c.inventory=[...k.equipment]; c.notes=c.notes||"";
  const i=chars.findIndex(x=>x.id===c.id);
  if(i>=0) chars[i]=c; else chars.push(c);
  await storeSet("forge-chars",chars);
  activeId=c.id; view="sheet"; render(); flashSave();
}

/* ════════════════ SHEET ════════════════ */
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const i=chars.findIndex(x=>x.id===draft.id);
    if(i>=0){ chars[i]=draft; await storeSet("forge-chars",chars); flashSave(); }
  },500);
}
function flashSave(){ const s=byId("savebar"); s.classList.add("show"); setTimeout(()=>s.classList.remove("show"),1300); }

function askNum(msg){ const v=prompt(msg); if(v===null) return null; const n=parseInt(v,10); return isNaN(n)||n<0?null:n; }

/* ── Dice toast ── */
let toastTimer=null;
function rollToast(label,m){
  const roll=d(20), total=roll+m;
  const t=byId("toast");
  t.classList.remove("crit","fumble");
  if(roll===20) t.classList.add("crit");
  if(roll===1) t.classList.add("fumble");
  byId("toastLb").textContent=label;
  byId("toastVl").textContent=total;
  byId("toastDt").textContent=`d20 (${roll}) ${m>=0?"+ "+m:"− "+Math.abs(m)}${roll===20?" · natural 20!":roll===1?" · natural 1…":""}`;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

    await saveCustom(); renderCustom(el); flashSave();
  };

  byId("crName").oninput=e=>cf.race.name=e.target.value;
  byId("crBon").oninput=e=>cf.race.bonusStr=e.target.value;
  byId("crSpeed").oninput=e=>cf.race.speed=+e.target.value||30;
  byId("crDark").onchange=e=>cf.race.darkvision=e.target.value==="yes";
  byId("crLangs").oninput=e=>cf.race.langs=e.target.value;
  byId("crDesc").oninput=e=>cf.race.desc=e.target.value;
  byId("crTraits").oninput=e=>cf.race.traitsTxt=e.target.value;
  byId("crAdd").onclick=async()=>{
    if(!cf.race.name.trim()) return alert("Give the race a name.");
    const bonuses={};
    cf.race.bonusStr.split(",").map(p=>p.trim()).filter(Boolean).forEach(p=>{
      const m=p.toLowerCase().match(/^(str|dex|con|int|wis|cha)\s*\+?\s*(\d)$/);
      if(m) bonuses[m[1]]=+m[2];
    });
    const traits=cf.race.traitsTxt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
      const i=l.indexOf(":"); return i>0?[l.slice(0,i).trim(),l.slice(i+1).trim()]:[l,""];
    });
    if(cf.race.darkvision) traits.unshift(["Darkvision","See in dim light within 60 feet as if it were bright light."]);
    CUSTOM.races.push({id:"race"+Date.now(),custom:true,name:cf.race.name.trim(),tag:"Custom race",
      bonuses,speed:cf.race.speed,darkvision:cf.race.darkvision,
      desc:cf.race.desc.trim()||"A custom race from your library.",traits,langs:cf.race.langs.trim()||"Common"});
    cf.race=blankRace();
    await saveCustom(); renderCustom(el); flashSave();
  };

  el.querySelectorAll("[data-delrace]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.delrace;
    if(usedRace(id)) return alert("A saved character uses this race. Bury them first.");
    CUSTOM.races=CUSTOM.races.filter(r=>r.id!==id); await saveCustom(); renderCustom(el);
  });
  el.querySelectorAll("[data-delsub]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.delsub;
    if(usedSub(id)) return alert("A saved character uses this archetype. Bury them first.");
    CUSTOM.subs=CUSTOM.subs.filter(s=>s.id!==id); await saveCustom(); renderCustom(el);
  });
  el.querySelectorAll("[data-delbg]").forEach(b=>b.onclick=async()=>{
    const id=b.dataset.delbg;
    if(usedBg(id)) return alert("A saved character uses this background. Bury them first.");
    CUSTOM.bgs=CUSTOM.bgs.filter(x=>x.id!==id); await saveCustom(); renderCustom(el);
  });
  enhanceControls();
}

  const saved=(await storeGet("forge-chars")) || (await storeGet("toa-chars"));

  if(cust && typeof cust==="object") CUSTOM={races:cust.races||[],subs:cust.subs||[],bgs:cust.bgs||[]};
  applyCustom();
  render();
